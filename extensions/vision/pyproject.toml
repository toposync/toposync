[project]
name = "toposync-ext-vision"
version = "0.11.0"
description = "Toposync first-party extension: task-oriented vision operators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "toposync-core>=0.11.0",
  "toposync-ext-cameras>=0.11.0",
  "numpy>=1.26,<3",
  "cryptography>=44,<47",
  "norfair>=2.2,<3",
  "onnx>=1.17,<2",
  # Includes the KleidiAI changing-input cache fix (onnxruntime#28363).
  "onnxruntime>=1.30,<2",
  "huggingface_hub>=0.34,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "tokenizers>=0.22,<1",
  "safetensors>=0.4,<1",
]
[project.entry-points."toposync.extensions"]
vision = "toposync_ext_vision.plugin:VisionExtension"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/models",
  "/models/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toposync_ext_vision"]
